server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/homit
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        format_sql: true
    servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 20MB
    web:
      resources:
        static-locations: file:./uploads/,classpath:/static/ #디렉토리를 정적 리소스로 제공.

file:
  upload-dir: uploads # 파일 저장 디렉토리
  profile-images-dir: static/profileimages

