server:
  port: ${SERVER_PORT}

spring:
  config:
    import: optional:.env

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: http://localhost:8080/login/oauth2/code/google
        provider:
          google:
            user-name-attribute: sub

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

  jackson: #enum 메핑 전역설정
    mapper:
      accept-case-insensitive-enums: true

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    properties:
      hibernate:
        format_sql: true

    servlet:
      multipart:
        max-file-size: 20MB
        max-request-size: 20MB
    web:
      resources:
        static-locations: file:./uploads/,classpath:/static/ #디렉토리를 정적 리소스로 제공.

file:
  upload-dir: uploads # 파일 저장 디렉토리
  profile-images-dir: static/profileimages

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
  refresh:
    secret: ${JWT_REFRESH_SECRET}

naver:
  api:
    client-id: ${NAVER_API_CLIENT_ID}
    client-secret: ${NAVER_API_CLIENT_SECRET}
    search-url: ${NAVER_API_SEARCH_URL}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.filter: DEBUG